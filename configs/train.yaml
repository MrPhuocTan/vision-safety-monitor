# =============================================================================
# Vision Safety Monitor — Training Configuration
# =============================================================================

# --- Data ---
data:
  # Path to prepared data.yaml (generated by prepare_dataset.py)
  yaml_path: "data/processed/data.yaml"
  # Source dataset path (read-only)
  source_path: "dataset/css-data"

# --- Model ---
model:
  # Pretrained checkpoint to start from
  base_weights: "yolov8n.pt"
  # Image size
  imgsz: 640

# --- Training ---
training:
  # Smoke test: quick validation of pipeline
  smoke:
    epochs: 2
    batch: 8
    patience: 2
  # Full training
  full:
    epochs: 100
    batch: 16
    patience: 10
  # Common settings
  optimizer: "SGD"
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.001
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  # Loss weights
  box: 7.5
  cls: 0.5
  dfl: 1.5
  # Augmentations
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  close_mosaic: 10

# --- Reproducibility ---
reproducibility:
  seed: 42
  deterministic: true

# --- Device ---
device: null  # null = auto-detect (CUDA > MPS > CPU)

# --- Output ---
output:
  project: "runs"
  name: "safety_train"
  save_period: -1
  exist_ok: true
